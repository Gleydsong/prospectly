<!doctype html>
<html lang="pt" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#09090b" />
    <meta
      name="description"
      content="Prospectly - plataforma inteligente para prospecção de clientes locais"
    />
    <!-- CSP is applied via nginx / Render headers in production; avoid conflicting meta CSP. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('prospectly:theme');
          if (t === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.dataset.theme = 'light';
            var meta = document.querySelector('meta[name="color-scheme"]');
            if (meta) meta.setAttribute('content', 'light');
            var theme = document.querySelector('meta[name="theme-color"]');
            if (theme) theme.setAttribute('content', '#eef1f6');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Prospectly</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
