<!doctype html>
<html lang="pt" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f1f2f4" />
    <meta
      name="description"
      content="Prospectly - plataforma inteligente para prospecção de clientes locais"
    />
    <!-- CSP is applied via nginx / Render headers in production; avoid conflicting meta CSP. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('prospectly:theme');
          if (t === 'dark') {
            document.documentElement.classList.remove('light');
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
            document.documentElement.dataset.theme = 'dark';
            var meta = document.querySelector('meta[name="color-scheme"]');
            if (meta) meta.setAttribute('content', 'dark');
            var theme = document.querySelector('meta[name="theme-color"]');
            if (theme) theme.setAttribute('content', '#090a0c');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.dataset.theme = 'light';
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <title>Prospectly</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
