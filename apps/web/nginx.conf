server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
  # same-origin-allow-popups is required for Google OAuth popup ↔ opener communication.
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
  # connect-src includes 'self' (same-origin /api proxy) and optional API origin via env at build time is preferred;
  # production API calls go through same origin or the configured VITE_API_URL host injected below.
  # accounts.google.com is required for Google Identity Services (script + OAuth popup).
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; connect-src 'self' https: https://accounts.google.com https://oauth2.googleapis.com https://www.googleapis.com; frame-src https://accounts.google.com" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
  }
}
