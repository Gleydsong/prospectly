services:
  postgres:
    image: postgres:16-alpine
    container_name: prospectly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prospectly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prospectly}
      POSTGRES_DB: ${POSTGRES_DB:-prospectly}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prospectly

  redis:
    image: redis:7-alpine
    container_name: prospectly-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prospectly

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: prospectly-api
    restart: unless-stopped
    env_file:
      - apps/api/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-prospectly}:${POSTGRES_PASSWORD:-prospectly}@postgres:5432/${POSTGRES_DB:-prospectly}?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - prospectly
    profiles:
      - full

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:3000/api/v1
    container_name: prospectly-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api
    networks:
      - prospectly
    profiles:
      - full

volumes:
  postgres-data:
  redis-data:

networks:
  prospectly:
    driver: bridge
