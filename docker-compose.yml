services:
  postgres:
    image: postgres:16-alpine
    container_name: prospectly-postgres
    restart: unless-stopped
    environment:
      # Local/dev only — never reuse these defaults in shared or production hosts.
      POSTGRES_USER: ${POSTGRES_USER:-prospectly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prospectly}
      POSTGRES_DB: ${POSTGRES_DB:-prospectly}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prospectly

  redis:
    image: redis:7-alpine
    container_name: prospectly-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prospectly

  # IA self-host (Llama via Ollama) — usada na geração de landing a partir do lead.
  # Sobe com: docker compose --profile ai up -d
  # Depois: docker compose exec ollama ollama pull llama3.1
  ollama:
    image: ollama/ollama:latest
    container_name: prospectly-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - prospectly
    profiles:
      - ai
      - full

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: prospectly-api
    restart: unless-stopped
    env_file:
      - apps/api/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-prospectly}:${POSTGRES_PASSWORD:-prospectly}@postgres:5432/${POSTGRES_DB:-prospectly}?schema=public
      REDIS_URL: redis://redis:6379
      LANDING_AI_PROVIDER: ${LANDING_AI_PROVIDER:-ollama}
      LANDING_AI_BASE_URL: ${LANDING_AI_BASE_URL:-http://ollama:11434}
      LANDING_AI_MODEL: ${LANDING_AI_MODEL:-llama3.1}
      LANDING_AI_TIMEOUT_MS: ${LANDING_AI_TIMEOUT_MS:-60000}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - prospectly
    profiles:
      - full

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: worker
    container_name: prospectly-worker
    restart: unless-stopped
    env_file:
      - apps/api/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-prospectly}:${POSTGRES_PASSWORD:-prospectly}@postgres:5432/${POSTGRES_DB:-prospectly}?schema=public
      REDIS_URL: redis://redis:6379
      ROLE: worker
      LANDING_AI_PROVIDER: ${LANDING_AI_PROVIDER:-ollama}
      LANDING_AI_BASE_URL: ${LANDING_AI_BASE_URL:-http://ollama:11434}
      LANDING_AI_MODEL: ${LANDING_AI_MODEL:-llama3.1}
      LANDING_AI_TIMEOUT_MS: ${LANDING_AI_TIMEOUT_MS:-60000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - prospectly
    profiles:
      - full

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:3000/api/v1
    container_name: prospectly-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - api
    networks:
      - prospectly
    profiles:
      - full

volumes:
  postgres-data:
  redis-data:
  ollama-data:

networks:
  prospectly:
    driver: bridge
