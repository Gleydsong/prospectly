services:
  postgres:
    image: postgres:16-alpine
    container_name: prospectly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prospectly}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: ${POSTGRES_DB:-prospectly}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prospectly

  redis:
    image: redis:7-alpine
    container_name: prospectly-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prospectly

  laya:
    image: python:3.12-slim
    container_name: prospectly-laya
    restart: unless-stopped
    command: >
      sh -c "pip install --no-cache-dir 'laya[serve]==0.3.24' && python -m laya.serve"
    environment:
      LAYA_HOST: "0.0.0.0"
      LAYA_PORT: "8000"
      LAYA_DEVICE: cpu
      LAYA_PRELOAD: "1"
      LAYA_MODELS: multilingual
      LAYA_DEFAULT_MODEL: multilingual
      LAYA_THREADS: "2"
    mem_limit: 3g
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - laya-models:/root/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prospectly

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: prospectly-api
    restart: unless-stopped
    env_file:
      - apps/api/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-prospectly}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-prospectly}?schema=public
      REDIS_URL: redis://redis:6379
      LAYA_URL: http://laya:8000/v1/systemone
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - prospectly
    profiles:
      - full

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: worker
    container_name: prospectly-worker
    restart: unless-stopped
    env_file:
      - apps/api/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-prospectly}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-prospectly}?schema=public
      REDIS_URL: redis://redis:6379
      LAYA_URL: http://laya:8000/v1/systemone
      ROLE: worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - prospectly
    profiles:
      - full

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:3000/api/v1
    container_name: prospectly-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - api
    networks:
      - prospectly
    profiles:
      - full

volumes:
  postgres-data:
  redis-data:
  laya-models:

networks:
  prospectly:
    driver: bridge
