# ==============================================================================
# Configuração Nginx para Streaming SSE do Assistente Prospectly
# NOTA IMPORTANTE (L8):
# Este arquivo é um SNIPPET/ARQUIVO DE TESTE autônomo, projetado para execução
# em containers de teste ou isolamento (ex: montado em /etc/nginx/conf.d/default.conf).
# NÃO É UM DROP-IN DE PRODUÇÃO e não deve substituir o server block principal da VPS.
#
# Para incluir em PRODUÇÃO na VPS Hostinger (Ubuntu 24.04 LTS com TLS / Certbot),
# copie apenas o trecho do bloco `location /api/v1/assistant/` abaixo e insira dentro
# do bloco `server { listen 443 ssl; server_name app.prospectly.com.br; ... }`
# já existente na VPS.
# ==============================================================================

upstream prospectly_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Bloco de configuração para o endpoint de streaming do assistente
    # (Copie este bloco location para o server block HTTPS/TLS da VPS de produção):
    location /api/v1/assistant/ {
        proxy_pass http://prospectly_api;
        proxy_http_version 1.1;

        # Desativação obrigatória de buffering para SSE (Server-Sent Events)
        # Garante que cada chunk (token) chegue ao cliente imediatamente
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Limpa o header Connection para permitir keepalive com o upstream
        proxy_set_header Connection "";

        # Timeouts estendidos para conexões de streaming de longa duração
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;

        # Encaminhamento de headers de segurança e IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Respeita o cabeçalho X-Accel-Buffering enviado pela API
        # A API Prospectly envia "X-Accel-Buffering: no" e "Cache-Control: no-cache"
        # o que instrui o Nginx a não reter buffers.
    }
}

# ------------------------------------------------------------------------------
# Roteiro de verificação manual e teste local com Docker:
# ------------------------------------------------------------------------------
# 1. Teste local com Docker (quando o daemon estiver ativo):
#    docker run --rm -d --name nginx-sse-test \
#      -p 8080:80 \
#      -v $(pwd)/deploy/nginx/assistant-sse.conf:/etc/nginx/conf.d/default.conf:ro \
#      nginx:alpine
#
# 2. Verificação de entrega incremental de chunks com timestamps:
#    curl -N -H "Authorization: Bearer <SEU_JWT>" \
#         -H "Content-Type: application/json" \
#         -X POST http://localhost:8080/api/v1/assistant/spike/stream \
#         -d '{"messages":[{"role":"user","content":"Olá"}]}' \
#         | while IFS= read -r line; do echo "[$(date +'%H:%M:%S.%3N')] $line"; done
#
# 3. Resultado esperado:
#    Os timestamps devem diferir progressivamente a cada linha "data: ...",
#    provando ausência de buffering intermediário no proxy.
# ------------------------------------------------------------------------------
