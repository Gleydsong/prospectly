name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version comes from package.json "packageManager" (avoids dual-version conflict)

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Audit dependencies (critical)
        run: pnpm audit --audit-level=critical

      - name: Audit dependencies (high report)
        # High advisories are tracked in docs/security/audit-exceptions.md (mostly toolchain).
        # Criticals already fail the job above; this step surfaces highs without soft-masking.
        run: pnpm audit --audit-level=high
        continue-on-error: true
