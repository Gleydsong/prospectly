name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # next build sets NODE_ENV=production; fail-fast requires a public https origin.
      NEXT_PUBLIC_LANDING_URL: https://prospectlyonboard.com
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version comes from package.json "packageManager" (avoids dual-version conflict)

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Secret scan (heuristic)
        run: node scripts/secret-scan.cjs

      - name: Audit dependencies (critical)
        run: pnpm audit --audit-level=critical

      - name: Audit runtime high advisories
        # Fails on high/critical that affect production dependency paths.
        # Documented exceptions: docs/security/audit-exceptions.md
        run: node scripts/audit-runtime.cjs

      - name: Audit dependencies (high)
        # Bloqueia qualquer high remanescente (overrides + ignoreGhsas documentados).
        run: pnpm audit --audit-level=high

  rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prospectly_rls
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d prospectly_rls"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/prospectly_rls?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations to disposable PostgreSQL
        run: pnpm --filter @prospectly/api exec prisma migrate deploy

      - name: Verify PostgreSQL row-level security
        run: pnpm --filter @prospectly/api test:rls
