name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version comes from package.json "packageManager" (avoids dual-version conflict)

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Audit dependencies (critical)
        run: pnpm audit --audit-level=critical

      - name: Audit runtime high advisories
        # Fails on high/critical that affect production dependency paths.
        # Documented exceptions: docs/security/audit-exceptions.md
        run: node scripts/audit-runtime.cjs

      - name: Audit dependencies (high)
        # Bloqueia qualquer high remanescente (overrides + ignoreGhsas documentados).
        run: pnpm audit --audit-level=high
